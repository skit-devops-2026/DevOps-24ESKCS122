<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Itinerary Planner - Plan Trip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Travel Itinerary Planner</div>
    <ul class="nav-links">
      <li><a href="plan.html" class="active">Plan Trip</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="card">
      <h2>Plan Your Journey</h2>
      <p class="subtitle">Tell us your preferences to create your customized itinerary.</p>

      <form id="plannerForm">
        <div class="form-group">
          <label for="destination">Destination</label>
          <input type="text" id="destination" placeholder="e.g. Jaipur, Goa, Manali" required>
        </div>

        <div class="form-group">
          <label for="totalDays">Duration (Days)</label>
          <input type="number" id="totalDays" min="1" max="14" value="3" required>
        </div>

        <div class="form-group">
          <label for="budgetTier">Budget Tier</label>
          <select id="budgetTier">
            <option value="Budget">Budget (Low Cost)</option>
            <option value="Moderate" selected>Moderate (Standard)</option>
            <option value="Luxury">Luxury (Premium)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="vibe">Travel Vibe</label>
          <select id="vibe">
            <option value="Culture & Heritage">Culture & Heritage</option>
            <option value="Food & Nightlife">Food & Nightlife</option>
            <option value="Beach & Coastal">Beach & Coastal</option>
            <option value="Adventure & Trekking">Adventure & Trekking</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Generate Itinerary</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
