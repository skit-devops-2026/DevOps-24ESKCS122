<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Itinerary Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Travel Itinerary Planner</div>
    <ul class="nav-links">
      <li><a href="plan.html">Plan Trip</a></li>
      <li><a href="dashboard.html" class="active">Dashboard</a></li>
    </ul>
  </nav>

<main class="container-wide">
    
    <div class="header-card">
      <div>
        <h2>3-Day Trip to Jaipur</h2>
        <p class="subtitle">Budget: <strong>Moderate</strong> | Vibe: <strong>Culture & Heritage</strong></p>
      </div>
      <div class="budget-badge">
        <span>Estimated Total</span>
        <h3>₹8,500</h3>
      </div>
    </div>

    <!-- Day Selector Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active">Day 1</button>
      <button class="tab-btn">Day 2</button>
      <button class="tab-btn">Day 3</button>
      <button class="btn-add-day">+ Add Day</button>
    </div>

    
</main>

</body>
</html>
