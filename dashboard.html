<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Itinerary Planner - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Travel Itinerary Planner</div>
    <ul class="nav-links">
      <li><a href="plan.html">Plan Trip</a></li>
      <li><a href="dashboard.html" class="active">Dashboard</a></li>
    </ul>
  </nav>

  <main class="container-wide">
    <div class="header-card">
      <div>
        <h2 id="tripTitle">3-Day Trip to Jaipur</h2>
        <p class="subtitle">Budget: <strong id="tripBudget">Moderate</strong> | Vibe: <strong id="tripVibe">Culture & Heritage</strong></p>
      </div>
      <div class="budget-badge">
        <span>Estimated Total</span>
        <h3 id="totalCostDisplay">₹0</h3>
      </div>
    </div>

    <!-- Action bar and tabs -->
    <div class="tabs-header-row">
      <div class="tabs-container" id="tabsContainer"></div>
      <button class="btn-primary-action" id="openAddModalBtn">+ Add Activity</button>
    </div>

    <!-- Activities container -->
    <div class="activities-grid" id="activitiesContainer"></div>
  </main>

  <!-- Add activity modal popup -->
   <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalDayTitle">Add Activity to Day 1</h3>
        <button class="btn-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="addActivityForm">
        <div class="form-group">
          <label for="newPlaceName">Place / Attraction Name</label>
          <input type="text" id="newPlaceName" placeholder="e.g. City Palace" required>
        </div>
        <div class="form-group">
          <label for="newTimeSlot">Time Slot</label>
          <input type="text" id="newTimeSlot" placeholder="e.g. 02:00 PM - 04:00 PM" required>
        </div>
        <div class="form-group">
          <label for="newRating">Rating</label>
          <input type="text" id="newRating" placeholder="e.g. ⭐ 4.6 / 5" value="⭐ 4.5 / 5" required>
        </div>
        <div class="form-group">
          <label for="newCost">Estimated Cost (₹)</label>
          <input type="number" id="newCost" placeholder="e.g. 500" min="0" required>
        </div>
        <div class="form-group">
          <label for="newDesc">Short Description</label>
          <input type="text" id="newDesc" placeholder="e.g. Scenic architectural monument." required>
        </div>
        <button type="submit" class="btn-submit">Save Activity</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
