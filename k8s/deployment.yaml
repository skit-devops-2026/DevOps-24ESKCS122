@'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-planner-deployment
  labels:
    app: travel-planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-planner
  template:
    metadata:
      labels:
        app: travel-planner
    spec:
      containers:
        - name: travel-planner-container
          image: ghcr.io/skit-devops-2026/devops-24eskcs122:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
'@ | Out-File -FilePath .\k8s\deployment.yaml -Encoding utf8 -NoNewline